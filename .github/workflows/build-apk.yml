name: Build BeatNova APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://fwowpkiivliyzaebzpvw.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_rEQEUxwxVSjVOsEzB9A7wA_IGH9V5X6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.13
        run: |
          curl -L --fail -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip
          rm gradle.zip

      - name: Normalize Compose Icon calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/beatnova/app/MainActivity.kt')
          s = p.read_text()
          replacements = {
              'Icon(icon, null, tint = color)': 'Icon(imageVector = icon, contentDescription = null, tint = color)',
              'Icon(Icons.Default.ChevronLeft, null, tint = Muted)': 'Icon(imageVector = Icons.Default.ChevronLeft, contentDescription = null, tint = Muted)',
              'Icon(icon, null, tint = White, Modifier.size(15.dp))': 'Icon(imageVector = icon, contentDescription = null, modifier = Modifier.size(15.dp), tint = White)',
              'Icon(icon, null, tint = Purple, Modifier.size(46.dp))': 'Icon(imageVector = icon, contentDescription = null, modifier = Modifier.size(46.dp), tint = Purple)',
              'Icon(icon,null,tint=if(active)Purple else Muted,Modifier.size(25.dp))': 'Icon(imageVector = icon, contentDescription = null, modifier = Modifier.size(25.dp), tint = if(active) Purple else Muted)',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          p.write_text(s)
          PY

      - name: Build debug APK
        run: ./gradle-8.13/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatNova-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
