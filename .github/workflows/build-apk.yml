name: Build BeatNova APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://fwowpkiivliyzaebzpvw.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_rEQEUxwxVSjVOsEzB9A7wA_IGH9V5X6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        run: |
          curl -L --fail -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          rm gradle.zip

      - name: Build debug APK
        run: ./gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatNova-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
