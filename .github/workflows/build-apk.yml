name: Build BeatNova APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://fwowpkiivliyzaebzpvw.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_rEQEUxwxVSjVOsEzB9A7wA_IGH9V5X6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Normalize Compose Icon syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/beatnova/app/MainActivity.kt')
          s = p.read_text()
          # Repair duplicated named-argument prefixes introduced by earlier auto-fixes.
          for name in ('imageVector', 'contentDescription', 'tint', 'modifier'):
              s = re.sub(r'\b' + name + r'\s*=\s*' + name + r'\s*=\s*', name + ' = ', s)
          # Repair positional Modifier arguments appearing after named Icon arguments.
          s = re.sub(r'(,\s*tint\s*=\s*[^,()]+),\s*Modifier\.size\(', r'\1, modifier = Modifier.size(', s)
          s = re.sub(r'(,\s*contentDescription\s*=\s*[^,()]+),\s*Modifier\.size\(', r'\1, modifier = Modifier.size(', s)
          p.write_text(s)
          PY

      - name: Build debug APK
        run: ./gradle-8.13/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatNova-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
