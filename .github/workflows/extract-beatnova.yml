name: Extract BeatNova project

on:
  push:
    paths:
      - 'BeatNova-Complete-Codemagic.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          rm -rf /tmp/beatnova
          mkdir -p /tmp/beatnova
          unzip -o BeatNova-Complete-Codemagic.zip -d /tmp/beatnova
          cp -a /tmp/beatnova/. .
          rm -f .github/workflows/extract-beatnova.yml

      - name: Commit extracted project
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: extract BeatNova project files'
          git push
