name: Fix BeatNova Song Query

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: robust song loading') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch song repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/beatnova/app/MainActivity.kt')
          s = p.read_text()
          old = 'private object SongRepository {'
          if old in s:
              s = s.replace(old, 'private object SongRepositoryLegacy {', 1)
              p.write_text(s)
          else:
              raise SystemExit('SongRepository declaration not found')
          Path('app/src/main/java/com/beatnova/app/SongRepository.kt').write_text(r'''package com.beatnova.app

import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import okhttp3.OkHttpClient
import okhttp3.Request
import org.json.JSONArray

internal data class BeatNovaSong(
    val id: String,
    val title: String,
    val artist: String,
    val audioUrl: String
)

object SongRepository {
    private val client = OkHttpClient()

    suspend fun load(): Result<List<BeatNovaSong>> = withContext(Dispatchers.IO) {
        val base = BuildConfig.SUPABASE_URL.trimEnd('/')
        val key = BuildConfig.SUPABASE_ANON_KEY
        if (base.isBlank() || key.isBlank()) return@withContext Result.failure(Exception("SUPABASE_CONFIG"))

        val urls = listOf(
            "$base/rest/v1/songs?select=id,title,artist,audio_url&order=created_at.desc",
            "$base/rest/v1/songs?select=id,title,artist,audio_url"
        )
        var lastError = "HTTP_ERROR"
        for (url in urls) {
            try {
                val request = Request.Builder()
                    .url(url)
                    .addHeader("apikey", key)
                    .addHeader("Accept", "application/json")
                    .build()
                client.newCall(request).execute().use { response ->
                    val raw = response.body?.string().orEmpty()
                    if (!response.isSuccessful) {
                        lastError = "HTTP_${response.code}:" + raw.take(120)
                        return@use
                    }
                    val array = JSONArray(raw)
                    val result = mutableListOf<BeatNovaSong>()
                    for (i in 0 until array.length()) {
                        val o = array.getJSONObject(i)
                        val audio = o.optString("audio_url")
                        if (audio.isNotBlank()) {
                            result += BeatNovaSong(
                                o.optString("id", i.toString()),
                                o.optString("title", "بدون نام"),
                                o.optString("artist", "هنرمند ناشناس"),
                                audio
                            )
                        }
                    }
                    return@withContext Result.success(result)
                }
            } catch (e: Exception) {
                lastError = e.message ?: "REQUEST_FAILED"
            }
        }
        Result.failure(Exception(lastError))
    }
}
''')
          main = p.read_text()
          # Replace the old private Song type with a typealias to the new repository model.
          main = main.replace('private data class Song(val id: String, val title: String, val artist: String, val audioUrl: String)', 'private typealias Song = BeatNovaSong', 1)
          p.write_text(main)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/beatnova/app/MainActivity.kt app/src/main/java/com/beatnova/app/SongRepository.kt
          git commit -m 'fix: robust song loading' || exit 0
          git push
