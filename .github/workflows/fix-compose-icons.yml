name: Fix Compose Icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fix-compose]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Icon calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/beatnova/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('imageVector = imageVector =', 'imageVector =')
          s = s.replace('contentDescription = contentDescription =', 'contentDescription =')
          s = s.replace(', tint = White, Modifier.size(', ', tint = White, modifier = Modifier.size(')
          s = s.replace(', tint = Purple, Modifier.size(', ', tint = Purple, modifier = Modifier.size(')
          s = s.replace(', tint=White, Modifier.size(', ', tint=White, modifier=Modifier.size(')
          s = s.replace(', tint=Muted, Modifier.size(', ', tint=Muted, modifier=Modifier.size(')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/beatnova/app/MainActivity.kt
          git diff --cached --quiet || git commit -m 'fix: normalize Compose Icon arguments [auto-fix-compose]'
          git push
