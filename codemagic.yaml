workflows:
  beatnova-android:
    name: BeatNova Android Final
    max_build_duration: 30
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.beatnova.app"
        SUPABASE_URL: $SUPABASE_URL
        SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
    scripts:
      - name: Configure Android SDK
        script: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
      - name: Prepare Gradle 8.9
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          curl -L --fail --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          rm -rf gradle-8.9
          unzip -q gradle.zip
          rm -f gradle.zip
          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" --version
      - name: Build BeatNova Release APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" --no-daemon --stacktrace clean assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/release/output-metadata.json
